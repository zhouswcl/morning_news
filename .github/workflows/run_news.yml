name: Daily Finance Morning News

on:
  # 每天北京时间 08:10 运行 (UTC 时间 00:10)
  schedule:
    - cron: '10 0 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run Morning News Script
        env:
          # 从 GitHub Secrets 中读取环境变量
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python morning_news.py
